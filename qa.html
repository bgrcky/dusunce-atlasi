<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Düşünce Atlası — QA</title><style>body{font:14px system-ui;background:#111;color:#eee;margin:0;padding:28px}main{max-width:1100px;margin:auto}h1{font:600 28px Georgia}p{color:#aaa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.k{border:1px solid #333;padding:16px}.n{font-size:28px}.ok{color:#8fd19e}.bad{color:#ff9b9b}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #292929;text-align:left}th{color:#999}code{color:#d8c38c}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>Düşünce Atlası · Sessiz QA</h1><p>Production haritasından bağımsızdır. Atlas linklerini ve hedef sayfaları kontrol eder; ana harita koduna dokunmaz.</p><div id="summary" class="grid"></div><table><thead><tr><th>Eser</th><th>Route</th><th>HTTP</th><th>Loader / İçerik</th></tr></thead><tbody id="rows"></tbody></table></main><script>(async()=>{let links={};try{links=await fetch('./data/ozetLinks.json?qa='+Date.now()).then(r=>r.json())}catch(e){document.body.insertAdjacentHTML('beforeend','<p class="bad">ozetLinks.json okunamadı.</p>');return}const entries=Object.entries(links),results=[];for(const [title,url] of entries){let status='ERR',content='—',ok=false;try{const r=await fetch(url+'?qa='+Date.now(),{cache:'no-store'});status=r.status;const text=await r.text();ok=r.ok;content=/loader\.js/.test(text)?'Loader':(/<body[\s>]/i.test(text)?'HTML':'Bilinmiyor')}catch(e){}results.push({title,url,status,content,ok})}const broken=results.filter(x=>!x.ok);const dup=entries.length-new Set(entries.map(x=>x[1])).size;document.querySelector('#summary').innerHTML=`<div class="k"><div class="n">${entries.length}</div>Atlas eşleşmesi</div><div class="k"><div class="n ok">${results.length-broken.length}</div>Ulaşılabilir</div><div class="k"><div class="n ${broken.length?'bad':'ok'}">${broken.length}</div>Kırık hedef</div><div class="k"><div class="n">${dup}</div>Paylaşılan route</div>`;document.querySelector('#rows').innerHTML=results.map(x=>`<tr><td>${esc(x.title)}</td><td><code>${esc(x.url)}</code></td><td class="${x.ok?'ok':'bad'}">${x.status}</td><td>${x.content}</td></tr>`).join('');function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}})()</script></body></html>
