<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Düşünce Atlası — Okuma Haritası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1e8d5; --card:#f8f2e4; --text:#241f16; --text-sec:#6e6250; --border:#d8caa9;
    --teal-bg:#e2ece5; --teal-bd:#5b7d6f; --teal-tx:#33473e;
    --gray-bg:#eee6d3; --gray-bd:#a99a79; --gray-tx:#544a37;
    --purple-bg:#e7e5f0; --purple-bd:#3d3a6b; --purple-tx:#2c2a4d;
    --amber-bg:#f3e3c3; --amber-bd:#a8791f; --amber-tx:#664e15;
    --music-bg:#f1dfe3; --music-bd:#9c5a6e; --music-tx:#5e3541;
    --arch-bg:#e0e6ec; --arch-bd:#45607e; --arch-tx:#28394b;
    --roman-bg:#efdcce; --roman-bd:#8a3a2b; --roman-tx:#5c261b;
    --gold:#a8791f;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'IBM Plex Sans',-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1710; --card:#252016; --text:#eee3c8; --text-sec:#a3937a; --border:#3c3423;
      --teal-bg:#243530; --teal-bd:#6fa08d; --teal-tx:#b6d6c8;
      --gray-bg:#332c1f; --gray-bd:#a99a79; --gray-tx:#d8cbaf;
      --purple-bg:#2a2846; --purple-bd:#7f7ac2; --purple-tx:#c9c6ea;
      --amber-bg:#3a2c10; --amber-bd:#caa044; --amber-tx:#f0d494;
      --music-bg:#3a2229; --music-bd:#c78398; --music-tx:#eec3ce;
      --arch-bg:#1e2732; --arch-bd:#7f9dbd; --arch-tx:#c6d7e6;
      --roman-bg:#3a2417; --roman-bd:#c17755; --roman-tx:#eec1a8;
      --gold:#caa044;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:
    radial-gradient(ellipse at 15% 8%, color-mix(in srgb, var(--gold) 7%, transparent), transparent 45%),
    var(--bg);
    font-family:var(--font-body);color:var(--text)}
  header{padding:22px 28px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--border)}
  h1{font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:.2px;margin:0 0 5px;color:var(--text)}
  h1::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:9px;vertical-align:middle}
  .progress{font-family:var(--font-mono);font-size:11px;color:var(--text-sec);margin-bottom:7px;letter-spacing:.2px}
  .nextup{font-size:12.5px;margin-bottom:10px;padding:7px 11px;border-radius:3px;background:var(--teal-bg);color:var(--teal-tx);
          display:inline-block;cursor:pointer;border:0.5px solid var(--teal-bd);border-left:2.5px solid var(--teal-bd)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--text-sec);flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .legend .tag{display:inline-block;font-size:9.5px;font-weight:500;padding:1.5px 6px;border-radius:8px;
        border:0.5px solid var(--text-sec);color:var(--text-sec);margin-right:5px;vertical-align:1px;letter-spacing:.3px}
  .legend .lineinfo{display:flex;align-items:center;gap:6px}
  .legend svg.mini{width:28px;height:10px;flex-shrink:0}
  .scroll{overflow-x:auto;overflow-y:hidden;padding:24px 28px 60px}
  #map{position:relative}
  .col-title{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text)}
  .col-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-sec);margin-top:2px}
  .col-sub-rep{position:absolute;font-size:10.5px;color:var(--text-sec);font-weight:500}
  .col-akim{font-family:var(--font-display);font-size:11px;color:var(--purple-tx);font-style:italic;margin-top:3px;line-height:1.3}
  .akim-rep{font-family:var(--font-display);font-size:10px;color:var(--purple-tx);font-style:italic;margin-top:2px;line-height:1.3}
  .col-olay{font-family:var(--font-mono);font-size:9px;color:var(--arch-tx);margin-top:3px;line-height:1.3}
  .olay-rep{font-family:var(--font-mono);font-size:8.5px;color:var(--arch-tx);margin-top:2px;line-height:1.3}
  .col-progress{font-size:10.5px;color:var(--text-sec);margin-top:2px}
  .section-title{position:absolute;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--gold);text-transform:uppercase;letter-spacing:1.6px}
  .divider{position:absolute;left:0;right:0;border-top:0.5px dashed var(--border);opacity:.8}
  .node{position:absolute;border-radius:3px;padding:8px 10px;border:0.5px solid var(--border);
        background:var(--card);transition:transform .12s,box-shadow .12s;overflow:hidden;
        box-shadow:0 1px 2px rgba(30,20,5,.05)}
  .node:hover{transform:scale(1.03);z-index:10;box-shadow:0 4px 14px rgba(30,20,5,.16)}
  .node.read{opacity:.5}
  .node.read .t{text-decoration:line-through}
  .node.nextup-highlight{box-shadow:0 0 0 2px var(--teal-bd);z-index:6}
  .node .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
  .node .tag{flex-shrink:0;display:inline-block;font-size:9px;font-weight:500;padding:1.5px 5px;
        border-radius:7px;letter-spacing:.3px;margin-top:1px;white-space:nowrap;max-width:100%;box-sizing:border-box}
  .node .row2{display:flex;align-items:center;gap:6px;margin-top:6px}
  .node .chk{width:12px;height:12px;flex-shrink:0;cursor:pointer;accent-color:var(--teal-bd)}
  .node .t{font-family:var(--font-display);font-size:13px;font-weight:600;line-height:1.25;color:var(--text);cursor:pointer;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node .s{font-family:var(--font-mono);font-size:9.5px;color:var(--text-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
  .node .why{font-family:var(--font-display);font-size:11px;color:var(--text-sec);font-style:italic;line-height:1.35;margin-top:6px;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .node .kw{font-size:9px;color:var(--teal-tx);font-weight:600;letter-spacing:.2px;margin-top:5px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .titlewrap{min-width:0;flex:1}
  .node:has(.tag-uslup) .row1{flex-direction:column;align-items:flex-start;gap:4px}
  .node:has(.tag-uslup) .titlewrap{width:100%}
  .tag-uslup{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box}
  .tier-Mutlaka{border-left:3px solid var(--teal-bd);background:var(--teal-bg)}
  .tier-Mutlaka .t{color:var(--teal-tx)}
  .tier-Onerilir{border-left:3px solid var(--gray-bd);background:var(--gray-bg)}
  .tier-Onerilir .t{color:var(--gray-tx)}
  .tier-Derinlesme{border-left:3px solid var(--purple-bd);background:var(--purple-bg)}
  .tier-Derinlesme .t{color:var(--purple-tx)}
  .tier-Dogu{border-left:3px solid var(--amber-bd);background:var(--amber-bg)}
  .tier-Dogu .t{color:var(--amber-tx)}
  .tier-Muzik{border-left:3px solid var(--music-bd);background:var(--music-bg)}
  .tier-Muzik .t{color:var(--music-tx)}
  .tier-Mimari{border-left:3px solid var(--arch-bd);background:var(--arch-bg)}
  .tier-Mimari .t{color:var(--arch-tx)}
  .tier-Roman{border-left:3px solid var(--roman-bd);background:var(--roman-bg)}
  .tier-Roman .t{color:var(--roman-tx)}
  .tag{font-family:var(--font-mono)}
  .tag-felsefe{border:0.5px solid #a8791f;color:#a8791f}
  .tag-tarih{border:0.5px solid #45607e;color:#45607e}
  .tag-siyaset{border:0.5px solid #8a3a2b;color:#8a3a2b}
  .tag-davranis{border:0.5px solid #4d6b3f;color:#4d6b3f}
  .tag-sanat{border:0.5px solid #9c5a6e;color:#9c5a6e}
  @media (prefers-color-scheme: dark){
    .tag-felsefe{border-color:#caa044;color:#caa044}
    .tag-tarih{border-color:#7f9dbd;color:#7f9dbd}
    .tag-siyaset{border-color:#c17755;color:#c17755}
    .tag-davranis{border-color:#8fb374;color:#8fb374}
    .tag-sanat{border-color:#c78398;color:#c78398}
  }
  .wiki{font-size:9px;color:var(--arch-tx);text-decoration:none;margin-left:auto}
  .wiki:hover{text-decoration:underline}
  .ozet-link{font-size:9px;color:var(--teal-tx);text-decoration:none;font-weight:600;margin-left:auto}
  .ozet-link:hover{text-decoration:underline}
  .ozet-link + .wiki{margin-left:8px}
  .nav-panel{position:fixed;right:20px;bottom:20px;z-index:20;background:var(--card);border:0.5px solid var(--border);
        border-radius:4px;box-shadow:0 6px 24px rgba(20,14,4,.22);padding:12px;max-width:220px}
  .nav-toggle{display:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);
        background:var(--card);cursor:pointer;align-items:center;justify-content:center}
  .nav-panel.collapsed .nav-body{display:none}
  .nav-panel.collapsed{padding:6px;border-radius:50%}
  .nav-panel.collapsed .nav-toggle{display:flex}
  .nav-row-label{font-family:var(--font-mono);font-size:9.5px;font-weight:500;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;margin:4px 0 4px}
  .nav-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .nav-btn{min-width:26px;height:26px;padding:0 6px;border-radius:3px;border:0.5px solid var(--border);
        background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:11px;font-weight:500;cursor:pointer}
  .nav-btn:hover{background:var(--amber-bg);border-color:var(--gold);color:var(--gold)}
  .nav-btn-wide{min-width:52px}
  svg.overlay{position:absolute;top:0;left:0;pointer-events:none}
  path.edge-short{fill:none;stroke:var(--text-sec);stroke-width:1;opacity:.4}
  path.edge-long{fill:none;stroke:var(--purple-bd);stroke-width:1.2;opacity:.45;stroke-dasharray:1 4;stroke-linecap:round}
  path.hi{stroke:var(--gold)!important;opacity:1!important;stroke-width:1.6px!important;stroke-dasharray:none!important}
</style>
</head>
<body>
<header>
  <h1>Düşünce Atlası — okuma haritası</h1>
  <div class="progress" id="progressText">Yükleniyor...</div>
  <div id="nextupWrap"></div>
  <div class="legend">
    <span><span class="dot" style="background:#5b7d6f"></span>Mutlaka oku</span>
    <span><span class="dot" style="background:#a99a79"></span>Önerilir</span>
    <span><span class="dot" style="background:#3d3a6b"></span>Derinleşme</span>
    <span><span class="dot" style="background:#a8791f"></span>Doğu</span>
    <span><span class="dot" style="background:#9c5a6e"></span>Müzik</span>
    <span><span class="dot" style="background:#45607e"></span>Mimari</span>
    <span><span class="dot" style="background:#8a3a2b"></span>Roman</span>
  </div>
  <div class="legend">
    <span><span class="tag tag-felsefe">FEL</span>Felsefe</span>
    <span><span class="tag tag-tarih">TAR</span>Tarih</span>
    <span><span class="tag tag-siyaset">SİY</span>Siyaset &amp; ekonomi</span>
    <span><span class="tag tag-davranis">PSİ</span>Psikoloji &amp; davranış</span>
    <span><span class="tag tag-sanat">SAN</span>Sanat &amp; deneme</span>
  </div>
  <div class="legend">
    <span class="lineinfo"><svg class="mini"><line x1="0" y1="5" x2="28" y2="5" stroke="var(--border)" stroke-width="1.2"/></svg>Aynı/komşu bölüm etkisi</span>
    <span class="lineinfo"><svg class="mini"><line x1="0" y1="5" x2="28" y2="5" stroke="var(--purple-bd)" stroke-width="1.3" stroke-dasharray="5 4"/></svg>Bölümler arası uzun yankı</span>
  </div>
</header>
<div class="scroll"><div id="map"></div></div>
<div id="navPanel" class="nav-panel">
  <button id="navToggle" class="nav-toggle" aria-label="Gezinme panelini aç">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
      <circle cx="12" cy="12" r="9.5" stroke="var(--gold)" stroke-width="1"/>
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke="var(--gold)" stroke-width="1"/>
      <path d="M15.5 8.5L11 11l-2.5 4.5L13 13l2.5-4.5z" fill="var(--gold)"/>
      <circle cx="12" cy="12" r="1.1" fill="var(--card)"/>
    </svg>
  </button>
  <div id="navBody" class="nav-body">
    <div class="nav-row-label">Bölüm</div>
    <div class="nav-row" id="navEras"></div>
    <div class="nav-row-label">Katman</div>
    <div class="nav-row" id="navLayers"></div>
  </div>
</div>

let readState = {};
async function loadState(){
  try{
    if(window.storage){
      const res = await window.storage.get('okuma-durumu', false);
      if(res && res.value){ readState = JSON.parse(res.value); return; }
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem('okuma-durumu');
    if(raw) readState = JSON.parse(raw);
  }catch(e){ readState = {}; }
}
async function saveState(){
  try{
    if(window.storage){ await window.storage.set('okuma-durumu', JSON.stringify(readState), false); return; }
  }catch(e){}
  try{ localStorage.setItem('okuma-durumu', JSON.stringify(readState)); }catch(e){}
}

function resolvePrereq(name, currentIdx){
  if(!name || name==='-') return null;
  let exact = flat.find(b=>b.eser===name);
  if(exact) return exact;
  const nameLc = name.toLowerCase();
  const before = flat.filter(b=>b.idx<currentIdx && b.yazar.toLowerCase().includes(nameLc));
  if(before.length) return before[before.length-1];
  const any = flat.filter(b=>b.yazar.toLowerCase().includes(nameLc) && b.idx!==currentIdx);
  return any[0]||null;
}
function prereqsSatisfied(item){
  if(item.onkosul==='-') return true;
  return item.onkosul.split(',').map(s=>s.trim()).every(name=>{
    const src = resolvePrereq(name, item.idx);
    if(!src) return true;
    return !!readState[src.eser];
  });
}
function computeNextUp(){
  const tiers = ['Mutlaka Oku','Önerilir','Derinleşme'];
  for(const tier of tiers){
    const cand = flat.find(f=> f.oncelik===tier && !readState[f.eser] && prereqsSatisfied(f));
    if(cand) return cand;
  }
  return null;
}
function renderNextUp(){
  const wrap = document.getElementById('nextupWrap');
  const nx = computeNextUp();
  if(!nx){ wrap.innerHTML=''; return; }
  wrap.innerHTML = '<div class="nextup" id="nextupBtn">Sıradaki okuman: <b>'+nx.eser+'</b> — '+nx.yazar+' ('+western[nx.col][0]+')</div>';
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('nextup-highlight'));
  const n = document.querySelector('.node[data-eser="'+CSS.escape(nx.eser)+'"]');
  if(n) n.classList.add('nextup-highlight');
  document.getElementById('nextupBtn').addEventListener('click', ()=>{
    if(n) n.scrollIntoView({behavior:'smooth', inline:'center', block:'center'});
  });
}
function updateProgress(){
  const totalW = flat.length, totalE = dflat.length;
  let readW=0, readE=0;
  flat.forEach(f=>{ if(readState[f.eser]) readW++; });
  dflat.forEach(f=>{ if(readState[f.eser]) readE++; });
  document.getElementById('progressText').textContent =
    'Batı: '+readW+'/'+totalW+' okundu · Doğu: '+readE+'/'+totalE+' okundu';
  western.forEach((col,ci)=>{
    const total = col[2].length;
    const read = col[2].filter(b=>readState[b[0]]).length;
    const elp = mapEl.querySelector('.col-progress[data-col="'+ci+'"]');
    if(elp) elp.textContent = read+'/'+total+' okundu';
  });
  renderNextUp();
}

function renderNode(key, titleTxt, subTxt, pos, tierClass, tagHtml, promptTxt, wikiUrl, ozetUrl){
  const el = document.createElement('div');
  el.className = 'node '+tierClass+(readState[key]?' read':'');
  el.style.left = pos.x+'px'; el.style.top = pos.y+'px'; el.style.width = pos.w+'px'; el.style.height = pos.h+'px';
  el.dataset.eser = key;
  const wikiHtml = wikiUrl ? '<a href="'+wikiUrl+'" target="_blank" rel="noopener" class="wiki">Wikipedia ↗</a>' : '';
  const ozetHtml = ozetUrl ? '<a href="'+ozetUrl+'" target="_blank" rel="noopener" class="ozet-link">Atlas ↗</a>' : '';
  const nk = nedenKavram[titleTxt];
  const whyHtml = nk ? '<div class="why">'+nk.neden+'</div><div class="kw">'+nk.kw.join(' · ')+'</div>' : '';
  el.innerHTML = '<div class="row1"><div class="titlewrap"><div class="t">'+titleTxt+'</div><div class="s">'+subTxt+'</div></div>'+(tagHtml||'')+'</div>'+
    whyHtml+
    '<div class="row2"><input type="checkbox" class="chk" '+(readState[key]?'checked':'')+'>'+ozetHtml+wikiHtml+'</div>';
  const chk = el.querySelector('.chk');
  chk.addEventListener('click', e=>e.stopPropagation());
  chk.addEventListener('change', async ()=>{
    readState[key] = chk.checked;
    el.classList.toggle('read', chk.checked);
    await saveState();
    updateProgress();
  });
  if(wikiUrl){ const a = el.querySelector('.wiki'); a.addEventListener('click', e=>e.stopPropagation()); }
  if(ozetUrl){ const a = el.querySelector('.ozet-link'); a.addEventListener('click', e=>e.stopPropagation()); }
  el.querySelector('.t').addEventListener('click', ()=>{ if(window.sendPrompt) sendPrompt(promptTxt); });
  mapEl.appendChild(el);
  return el;
}

    const x = LEFT+ci*(COLW+GAP_X);
    const y = romanTop+ri*(NODEH_R+GAP_Y_R);
    renderNode('roman:'+r[0], r[0], r[1], {x,y,w:COLW,h:NODEH_R}, 'tier-Roman', '', "'"+r[0]+"' hakkında bilgi ver", null, ozetLinks[r[0]]);
  });
});
Object.keys(doguRoman).forEach(ci=>{
  const items = doguRoman[ci];
  items.forEach((r,ri)=>{
    const x = LEFT+parseInt(ci)*(COLW+GAP_X);
    const y = romanTop+(romanMaxRows+ri)*(NODEH_R+GAP_Y_R);
    renderNode('roman-dogu:'+r[0], r[0], r[1], {x,y,w:COLW,h:NODEH_R}, 'tier-Dogu', '', "'"+r[0]+"' hakkında bilgi ver");
  });
});
const doguRomanMax = Math.max(0, ...Object.values(doguRoman).map(a=>a.length));
cursorY = romanTop + (romanMaxRows+doguRomanMax)*(NODEH_R+GAP_Y_R) + 30;

mapEl.style.width = mapW+'px';
mapEl.style.height = cursorY+'px';

const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('class','overlay');
svg.setAttribute('width', mapW); svg.setAttribute('height', cursorY);
mapEl.insertBefore(svg, mapEl.firstChild);

const edges = [];
flat.forEach(item=>{
  item.onkosul.split(',').map(s=>s.trim()).forEach(name=>{
    const src = resolvePrereq(name, item.idx);
    if(src){
      const sp = westPos(src), tp = westPos(item);
      const x1 = sp.x+sp.w, y1 = sp.y+sp.h/2;
      const x2 = tp.x, y2 = tp.y+tp.h/2;
      const dx = Math.max(40, Math.abs(x2-x1)*0.5);
      const d = 'M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const colDiff = Math.abs(item.col-src.col);
      const edgeClass = colDiff>=2 ? 'edge-long' : 'edge-short';
      path.setAttribute('d', d); path.setAttribute('class', edgeClass);
      path.dataset.target = item.eser; path.dataset.source = src.eser;
      svg.appendChild(path);
      edges.push(path);
    }
  });
});

document.querySelectorAll('.node').forEach(n=>{
  n.addEventListener('mouseenter', ()=>{
    const eser = n.dataset.eser;
    edges.forEach(p=>{ p.classList.toggle('hi', p.dataset.target===eser || p.dataset.source===eser); });
  });
  n.addEventListener('mouseleave', ()=>{ edges.forEach(p=>p.classList.remove('hi')); });
});

(async ()=>{
  await loadState();
  document.querySelectorAll('.node').forEach(n=>{
    const key = n.dataset.eser;
    if(readState[key]){ n.classList.add('read'); const c=n.querySelector('.chk'); if(c) c.checked=true; }
  });
  updateProgress();
})();

// --- Navigation panel: quick-jump by era (horizontal) and by layer (vertical) ---
const scrollEl = document.querySelector('.scroll');
const romanNumerals = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const navErasEl = document.getElementById('navEras');
romanNumerals.forEach((label,ci)=>{
  const btn = document.createElement('button');
  btn.className = 'nav-btn';
  btn.textContent = label;
  btn.title = western[ci][0];
  btn.addEventListener('click', ()=>{
    const targetX = LEFT+ci*(COLW+GAP_X)-24;
    scrollEl.scrollTo({left: targetX, behavior:'smooth'});
  });
  navErasEl.appendChild(btn);
});
const navLayersEl = document.getElementById('navLayers');
const layerTargets = [
  ['Ana', 0],
  ['Doğu', navDoguY],
  ['Müzik', navMuzikY],
  ['Mimari', navMimariY],
  ['Roman', navRomanY]
];
layerTargets.forEach(([label,y])=>{
  const btn = document.createElement('button');
  btn.className = 'nav-btn nav-btn-wide';
  btn.textContent = label;
  btn.addEventListener('click', ()=>{
    window.scrollTo({top: Math.max(0,y-90), behavior:'smooth'});
  });
  navLayersEl.appendChild(btn);
});
document.getElementById('navToggle').addEventListener('click', ()=>{
  document.getElementById('navPanel').classList.toggle('collapsed');
});
</script>
</body>
</html>
