<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="description" content="Batı ve Doğu düşünce tarihini kronolojik, önkoşullu ve çok katmanlı bir yol haritasıyla keşfet — felsefe, tarih, müzik, mimari ve roman bir arada.">
<title>Düşünce Atlası — Okuma Haritası</title>
</head>
<body>
<script>
const ATLAS_BUILD = '20260820-layout-restore';
fetch('./index-core.html?v='+ATLAS_BUILD).then(function(r){ if(!r.ok) throw new Error('core'); return r.text(); }).then(function(html){
  html = html.replace('</head>', '<link rel="stylesheet" href="./mobile.css?v='+ATLAS_BUILD+'"><link rel="stylesheet" href="./mobile-v2.css?v='+ATLAS_BUILD+'"><link rel="stylesheet" href="./desktop-nav-fix.css?v='+ATLAS_BUILD+'"></head>');
  html = html.replace('</body>', '<script src="./features.js?v='+ATLAS_BUILD+'"><\/script><script src="./route-readability.js?v='+ATLAS_BUILD+'"><\/script><script src="./v7.js?v='+ATLAS_BUILD+'"><\/script><script src="./route-cleanup.js?v='+ATLAS_BUILD+'"><\/script><script src="./mobile-v2.js?v='+ATLAS_BUILD+'"><\/script></body>');
  document.open(); document.write(html); document.close();
}).catch(function(){ document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Düşünce Atlası yüklenemedi. Lütfen sayfayı yenile.</p>'; });
</script>
</body>
</html>
