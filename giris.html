<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Düşünce Atlası'ndaki dönemlerin neden bu sırayla takip edilmesi gerektiğini ve her dönemi şekillendiren büyük olayları anlatan giriş sayfası.">
<title>Dönemler Üzerine — Düşünce Atlası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9.5' fill='%23f1e8d5' stroke='%23a8791f' stroke-width='1.3'/%3E%3Cpath d='M15.5 8.5L11 11l-2.5 4.5L13 13l2.5-4.5z' fill='%23a8791f'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f1e8d5; --card:#f8f2e4; --text:#241f16; --text-sec:#6e6250; --border:#d8caa9;
    --gold:#a8791f;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'IBM Plex Sans',-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1710; --card:#252016; --text:#eee3c8; --text-sec:#a3937a; --border:#3c3423;
      --gold:#caa044;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:
    radial-gradient(ellipse at 15% 8%, color-mix(in srgb, var(--gold) 7%, transparent), transparent 45%),
    var(--bg);
    font-family:var(--font-body);color:var(--text);line-height:1.6}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;z-index:0}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:48px 24px 80px}
  .back-link{font-family:var(--font-mono);font-size:11.5px;color:var(--gold);text-decoration:none;letter-spacing:.3px}
  .back-link:hover{text-decoration:underline}
  .top-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .katman-tabs{display:flex;gap:6px}
  .katman-tab{font-family:var(--font-mono);font-size:11.5px;color:var(--text-sec);text-decoration:none;
    padding:6px 12px;border:0.5px solid var(--border);border-radius:14px;letter-spacing:.3px;transition:border-color .2s ease,color .2s ease}
  .katman-tab.active{color:var(--gold);border-color:var(--gold);background:color-mix(in srgb, var(--gold) 10%, transparent)}
  .katman-tab:hover{border-color:var(--gold);color:var(--gold)}
  h1{font-family:var(--font-display);font-size:30px;font-weight:600;margin:18px 0 6px;letter-spacing:.2px}
  .intro{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--text-sec);margin-bottom:8px;max-width:560px}

  /* ---- Atlas-tarzı güzergah navigasyonu ---- */
  .route-nav-wrap{margin:28px 0 40px;position:relative}
  .route-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:6px 4px 10px}
  .route-scroll::-webkit-scrollbar{display:none}
  .hero-route{height:96px;display:block}
  .hero-route path.trail{fill:none;stroke:var(--border);stroke-width:1.1;stroke-dasharray:1 6;stroke-linecap:round}
  .route-wp{cursor:pointer}
  .route-wp .ring-outer{fill:none;stroke:var(--gold);stroke-width:0.8;opacity:.4;transition:opacity .25s ease}
  .route-wp .ring-inner{fill:var(--card);stroke:var(--gold);stroke-width:1.3;transition:r .25s ease, fill .25s ease}
  .route-wp .wp-label{font-family:var(--font-display);font-size:11px;font-weight:600;fill:var(--gold);text-anchor:middle;dominant-baseline:central;transition:fill .25s ease}
  .route-wp:hover .ring-outer{opacity:.75}
  .route-wp.active .ring-inner{fill:var(--gold)}
  .route-wp.active .wp-label{fill:var(--card)}
  .route-wp.active .ring-outer{opacity:.9}

  .donem{padding-bottom:36px;opacity:0;transform:translateY(22px);transition:opacity .7s ease, transform .7s ease;scroll-margin-top:32px}
  .donem.in-view{opacity:1;transform:none}
  .donem-row{display:grid;grid-template-columns:56px minmax(0,1fr) 320px;gap:24px;align-items:start;position:relative}
  .side-rail{position:sticky;top:24px}
  @media (max-width:900px){
    .donem-row{grid-template-columns:56px minmax(0,1fr)}
    .side-rail{grid-column:1 / -1;margin-left:72px;position:static}
  }

  .seal-col{position:relative}
  .seal{flex-shrink:0;width:56px;height:56px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
        font-size:16px;font-weight:600;color:var(--gold);margin-top:2px;position:relative;z-index:2;
        background:var(--card);
        box-shadow:0 0 0 1.3px var(--gold), 0 0 0 4px var(--bg), 0 0 0 5px color-mix(in srgb, var(--gold) 35%, transparent)}
  .seal-watermark{position:absolute;top:-18px;left:56px;font-family:var(--font-display);font-style:italic;
        font-size:120px;font-weight:600;color:var(--gold);opacity:.05;line-height:1;pointer-events:none;
        user-select:none;z-index:0}
  @media (max-width:900px){ .seal-watermark{font-size:80px} }

  .donem-body{flex:1;min-width:0;position:relative;z-index:1}
  .divider-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 36px;color:var(--gold);opacity:.6}
  .divider-orn::before,.divider-orn::after{content:'';flex:1;height:0.5px;background:var(--border);max-width:120px}
  .donem h2{font-family:var(--font-display);font-size:23px;font-weight:600;margin:0 0 4px;letter-spacing:.1px}
  .donem-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-sec);margin-bottom:18px;
        text-transform:uppercase;letter-spacing:1px}
  .donem-baglam{font-size:15.5px;margin-bottom:20px;max-width:60ch}
  .donem-baglam::first-letter{font-family:var(--font-display);font-size:2.8em;line-height:.75;
        float:left;padding:5px 7px 0 0;color:var(--gold);font-weight:600}
  .olaylar-label{font-family:var(--font-mono);font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
  .olaylar-list{list-style:none;margin:0;padding:0}
  .olaylar-list li{font-size:13.5px;color:var(--text-sec);padding:5px 0 5px 16px;position:relative;border-left:1.5px solid var(--border)}
  .olaylar-list li::before{content:'';position:absolute;left:-4px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .loading{font-family:var(--font-mono);font-size:12px;color:var(--text-sec)}

  /* ---- Sinematik hero görsel işleme ---- */
  .hero-img-wrap{margin:0 0 14px;border-radius:6px;overflow:hidden;position:relative;
        border:0.5px solid var(--border);
        box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
  .hero-img-frame{position:relative;overflow:hidden;height:230px}
  .hero-img-frame img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;
        filter:sepia(28%) saturate(85%) contrast(1.05) brightness(0.92);
        transition:transform .8s cubic-bezier(.2,.8,.2,1);transform:scale(1.04)}
  .hero-img-wrap:hover .hero-img-frame img{transform:scale(1.14)}
  .hero-img-frame::after{content:'';position:absolute;inset:0;pointer-events:none;
        background:
          linear-gradient(to top, color-mix(in srgb, var(--text) 55%, transparent) 0%, transparent 38%),
          radial-gradient(ellipse at center, transparent 55%, color-mix(in srgb, var(--text) 30%, transparent) 130%)}
  .hero-img-frame::before{content:'';position:absolute;top:8px;left:8px;width:14px;height:14px;
        border-top:1px solid color-mix(in srgb, var(--card) 80%, transparent);
        border-left:1px solid color-mix(in srgb, var(--card) 80%, transparent);opacity:.7;z-index:2}
  .hero-caption{font-family:var(--font-mono);font-size:9px;color:var(--text-sec);padding:6px 8px;background:var(--card);line-height:1.4}
  .figures-row{display:flex;gap:14px;margin:0;justify-content:flex-start;flex-wrap:wrap}
  .figure{text-align:center;width:58px}
  .figure img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold);
        filter:sepia(28%) saturate(85%) contrast(1.05) brightness(0.92);transition:transform .3s ease}
  .figure img:hover{transform:scale(1.08)}
  .figure .fname{font-family:var(--font-mono);font-size:9px;color:var(--text-sec);margin-top:5px;line-height:1.3}
  footer{margin-top:20px}
  .cta{display:inline-block;margin-top:10px;font-family:var(--font-mono);font-size:12px;color:var(--gold);
        border:0.5px solid var(--gold);border-radius:4px;padding:8px 16px;text-decoration:none;transition:background .2s ease}
  .cta:hover{background:color-mix(in srgb, var(--gold) 12%, transparent)}

  @media (prefers-reduced-motion: reduce){
    .donem, .hero-img-frame img, .figure img{transition:none !important}
    .donem{opacity:1 !important;transform:none !important}
  }
</style>
</head>
<body>
<svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="wrap">
  <div class="top-row">
    <a href="./" class="back-link">← Haritaya dön</a>
    <div class="katman-tabs" id="katmanTabs"></div>
  </div>
  <h1 id="pageTitle">Dönemler Üzerine</h1>
  <div class="intro" id="pageIntro"></div>
  <div class="route-nav-wrap">
    <div class="route-scroll">
      <svg class="hero-route" id="heroRoute" viewBox="0 0 674 110" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div id="content"><div class="loading">Yükleniyor…</div></div>
  <footer>
    <a href="./" class="cta">Haritayı Keşfet →</a>
  </footer>
</div>
<script>
// ---- Katman yapılandırması ----
// Yeni bir katman eklemek için: 1) data/ altına donemler + baglam + olaylar (+ opsiyonel gorseller) json'ları ekle
// 2) aşağıdaki KATMANLAR objesine bir girdi ekle. Kod değişikliği gerekmez.
const KATMANLAR = {
  western: {
    label: 'Batı',
    donemFile: 'data/western.json',
    baglamFile: 'data/donemBaglam.json',
    olaylarFile: 'data/donemOlaylari.json',
    gorselFile: 'data/donemGorsellerWestern.json',
    intro: "Düşünce Atlası, kitapları rastgele bir liste olarak değil, birbirini besleyen on dönem halinde sunar. Her dönem kendinden öncekine bir cevap, kendinden sonrakine bir zemin. Aşağıda her dönemin neden bu sırada durduğunu ve o dönemi şekillendiren büyük olayları bulacaksın."
  },
  dogu: {
    label: 'Doğu',
    donemFile: 'data/doguDonemler.json',
    baglamFile: 'data/donemBaglamDogu.json',
    olaylarFile: 'data/donemOlaylariDogu.json',
    gorselFile: 'data/donemGorsellerDogu.json',
    intro: "Doğu düşüncesi, Batı'nın on dönemine paralel bir zaman çizgisinde ilerler, ama kendi sorularını kendi diliyle sorar. Bu yedi dönem, Çin ve Hint klasik çağından İslam'ın altın çağına, Osmanlı ıslahatından sömürgecilik sonrası düşünceye uzanan bir çizgi izler."
  }
};

function romanNumeral(i){
  const table = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  return table[i] || String(i+1);
}

let scrollObserver = null;
let navObserver = null;

async function loadKatman(katmanKey){
  const cfg = KATMANLAR[katmanKey] || KATMANLAR.western;
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '<div class="loading">Yükleniyor…</div>';
  document.getElementById('pageIntro').textContent = cfg.intro;

  if(scrollObserver) scrollObserver.disconnect();
  if(navObserver) navObserver.disconnect();

  // Sekmeleri çiz
  const tabsEl = document.getElementById('katmanTabs');
  tabsEl.innerHTML = Object.keys(KATMANLAR).map(k => {
    const active = k === katmanKey ? ' active' : '';
    return '<a class="katman-tab' + active + '" href="?katman=' + k + '">' + KATMANLAR[k].label + '</a>';
  }).join('');

  const fetchJson = (url) => fetch(url).then(r => {
    if(!r.ok) throw new Error('fetch failed: ' + url);
    return r.json();
  });

  const [donemRaw, baglam, olaylar, gorseller] = await Promise.all([
    fetchJson(cfg.donemFile),
    fetchJson(cfg.baglamFile),
    fetchJson(cfg.olaylarFile),
    cfg.gorselFile ? fetchJson(cfg.gorselFile).catch(() => ({})) : Promise.resolve({})
  ]);

  // Western formatı: {donem, altbaslik, eserler}. Dogu/diğer formatı: {donem, altbaslik, col}.
  // Görsel eşlemesi için anahtar: eğer öğede "col" varsa onu, yoksa dizideki index'i kullan.
  const donemler = donemRaw.map((d, i) => ({ ...d, _gorselKey: (d.col !== undefined ? String(d.col) : String(i)) }));

  // ---- Atlas-tarzı güzergah navigasyonunu dinamik çiz ----
  const n = donemler.length;
  const routeEl = document.getElementById('heroRoute');
  const routeW = Math.max(674, n * 74);
  routeEl.setAttribute('viewBox', '0 0 ' + routeW + ' 110');
  const amp = [62,88,48,80,54,86,50,78,56,72];
  const pts = [];
  for(let i = 0; i < n; i++){
    pts.push({ x: 44 + i * 74, y: amp[i % amp.length] });
  }
  let pathD = '';
  pts.forEach((p, i) => {
    if(i === 0){ pathD += 'M' + p.x + ',' + p.y; }
    else{
      const prev = pts[i-1];
      pathD += ' C' + (prev.x + 26) + ',' + prev.y + ' ' + (p.x - 26) + ',' + p.y + ' ' + p.x + ',' + p.y;
    }
  });
  let nodesHtml = '';
  pts.forEach((p, i) => {
    nodesHtml += '<g class="route-wp" data-target="donem-' + i + '">' +
      '<circle class="ring-outer" cx="' + p.x + '" cy="' + p.y + '" r="16"/>' +
      '<circle class="ring-inner" cx="' + p.x + '" cy="' + p.y + '" r="12"/>' +
      '<text class="wp-label" x="' + p.x + '" y="' + p.y + '">' + romanNumeral(i) + '</text>' +
    '</g>';
  });
  routeEl.innerHTML = '<path class="trail" d="' + pathD + '"/>' + nodesHtml;

  // Waypoint tıklaması -> ilgili döneme yumuşak kaydırma
  routeEl.querySelectorAll('.route-wp').forEach(wp => {
    wp.addEventListener('click', () => {
      const target = document.getElementById(wp.getAttribute('data-target'));
      if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  let html = '';
  donemler.forEach((donem, i) => {
    const olayListHtml = (olaylar[i] || []).map(o => '<li>' + o + '</li>').join('');
    const g = gorseller[donem._gorselKey];
    const heroHtml = (g && g.hero) ? '<div class="hero-img-wrap"><div class="hero-img-frame"><img src="' + g.hero + '" loading="lazy" alt="' + donem.donem + '"></div><div class="hero-caption">' + g.heroCaption + '</div></div>' : '';
    const figuresHtml = (g && g.figures && g.figures.length) ? '<div class="figures-row">' + g.figures.map(f => '<div class="figure"><img src="' + f.img + '" loading="lazy" alt="' + f.name + '"><div class="fname">' + f.name + '</div></div>').join('') + '</div>' : '';
    const sideRailHtml = (heroHtml || figuresHtml) ? '<div class="side-rail">' + heroHtml + figuresHtml + '</div>' : '<div></div>';
    html += '<div class="donem" id="donem-' + i + '">' +
      '<div class="donem-row">' +
        '<div class="seal-col">' +
          '<div class="seal-watermark">' + romanNumeral(i) + '</div>' +
          '<div class="seal">' + romanNumeral(i) + '</div>' +
        '</div>' +
        '<div class="donem-body">' +
          '<h2>' + donem.donem.replace(/^[IVXLCDM]+\.\s*/, '') + '</h2>' +
          '<div class="donem-sub">' + donem.altbaslik + '</div>' +
          '<div class="donem-baglam">' + (baglam[i] || '') + '</div>' +
          '<div class="olaylar-label">Dönemi Etkileyen Büyük Olaylar</div>' +
          '<ul class="olaylar-list">' + olayListHtml + '</ul>' +
        '</div>' +
        sideRailHtml +
      '</div>' +
    '</div>';
    if(i < donemler.length - 1) html += '<div class="divider-orn">◆</div>';
  });
  contentEl.innerHTML = html;

  // ---- Scroll-in animasyonu ----
  const donemEls = contentEl.querySelectorAll('.donem');
  scrollObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        scrollObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  donemEls.forEach(el => scrollObserver.observe(el));

  // ---- Aktif dönemi güzergahta vurgula ----
  const wpByTarget = {};
  routeEl.querySelectorAll('.route-wp').forEach(wp => { wpByTarget[wp.getAttribute('data-target')] = wp; });
  navObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const wp = wpByTarget[entry.target.id];
      if(!wp) return;
      if(entry.isIntersecting){
        Object.values(wpByTarget).forEach(w => w.classList.remove('active'));
        wp.classList.add('active');
      }
    });
  }, { threshold: 0.5 });
  donemEls.forEach(el => navObserver.observe(el));
}

const params = new URLSearchParams(window.location.search);
const initialKatman = KATMANLAR[params.get('katman')] ? params.get('katman') : 'western';
loadKatman(initialKatman);
</script>
</body>
</html>
